[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptci"
version = "0.1.0"
description = "Deterministic CI pipelines for prompt changes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
promptci = "promptci.cli:main"

[tool.setuptools]
packages = ["promptci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
